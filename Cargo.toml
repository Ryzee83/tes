[package]
name = "lumabeat"
version = "0.1.0"
edition = "2021"
description = "Pemutar musik estetik super ringan: cahaya tepi layar, player kaca, lirik tersinkron"

[dependencies]
# Win32 mentah (tanpa wrapper) -> kecil & cepat
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# WinRT: dipakai hanya untuk System Media Transport Controls & pemutar file lokal
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Media_Core",
    "Media_Playback",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
] }
# WASAPI loopback (menangkap audio keluaran sistem, BUKAN mikrofon)
cpal = "0.15"
# Hanya decoder JPEG + PNG untuk cover album
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
